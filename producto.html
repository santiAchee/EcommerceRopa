<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta   name="color-scheme" content="Light dark">
    <title>Mundo Ropa</title>
    <link rel="stylesheet" href=css/estilos.css>
    <script src="JS/menu.js" defer></script>
    <script src="JS/main.js" defer></script>
</head>


<body>
    <header>
        <div  class="contenedor-header">
 <h1 class="mr-logo"><a href=index.html>Mundo Ropa</a></h1>
 
 


     <div class="controles">
                
                
                <button id="lista-favoritos" class="fav-btn" aria-label="Ingresar a favoritos" aria-controls="primary-fav" aria-expanded="false">
                    <span class="sr-only">favoritos</span>
                    <span id="fav-count" class="fav-count">0</span>
                </button>

                <button id="carrito" class="cart-btn" aria-label="Ingresar a carrito" aria-controls="primary-cart" aria-expanded="false">
                    <span class="sr-only">Carrito de compras</span>
                    <span class="cart-count">0</span>
                </button>

                <button id="menu-principal" class="menu-btn" aria-label="Ingresar al menu principal" aria-controls="primary-navigation" aria-expanded="false"><span class="sr-only">Menu principal</span></button>
            </div>
        </div>

  
    </header>




    <main> 

    <section  class="seleccion-producto">
        <div class="detalle-producto">

            <!-- columna izquierda: imagenes del producto -->
            <div class="galeria-producto">
                <img src="images/cazadora_piel.jpg" alt="ropa 1">
                <img src="images/cazadora_piel.jpg" alt="ropa 1">
                <img src="images/cazadora_piel.jpg" alt="ropa 1">
                <img src="images/cazadora_piel.jpg" alt="ropa 1">
            </div>

               <!-- columna derecha: detalles del producto -->
            <div class="producto-detalles">
                <h2>Cazadora de piel</h2>
                <p>Precio: $ 15.000</p>


                <!-- Selector de talles -->
                 <div class="selector-talle">
                <label for="talle">Seleccionar talle:</label>
                <select name="talle" id="talle">
                    <option value="xs">XS</option>
                    <option value="s">S</option>
                    <option value="m">M</option>
                    <option value="l">L</option>
                    <option value="xl">XL</option>
                </select>
                </div>
               <!-- Descripcion -->
                <p>Descripcion: Cazadora de piel de alta calidad, ideal para cualquier ocasion.</p>

                <!-- Botones de agregar al carrito y a favoritos -->
                <div class="producto-acciones">
                    <button class="agregar-carrito">Agregar al carrito</button>
                    <button class="agregar-fav">Agregar a favoritos</button>
                </div>
            </div>

        </div>
    </section>




    </main>










    <footer>
        <div class="contenedor-footer">
            <h1>Mundo Ropa</h1>

    <span class="sr-only">Contactanos a travez de WhatsApp</span>
</a>
            </ul>


            <p>Mundo Ropa | ISTEA 2026</p>
        </div>

    </footer>

    
</body>
</html>
